name: Build and Deploy static content to Pages with Docker

on:
  # Pushes to main are published to /current/. When the version in sushi-config.yaml is a release (X.Y.Z) that
  # has not been published yet, the same run also publishes it to /<version>/, /<major>/ and the root, and tags it.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# and pushing the published versions to the gh-pages branch and the release tags
permissions:
  id-token: write
  contents: write
  packages: write
  pages: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  build:
    # Only main is published
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build and push to local registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: localhost:5000/nuts-foundation/publisher:latest
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out published versions
        # The gh-pages branch keeps all published versions, as each deployment replaces the whole site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi
      - name: Determine publication paths
        id: paths
        run: |
          version=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' sushi-config.yaml)
          published=$(ls site | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          paths="current"
          # Only X.Y.Z is a release; a version with a suffix, such as 1.1.0-draft, is only published to /current/
          if [[ "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            major="${BASH_REMATCH[1]}"
            if [ -d "site/$version" ]; then
              echo "Version $version has already been published"
            else
              echo "release=$version" >> "$GITHUB_OUTPUT"
              paths="$paths $version"
              releases=$(printf '%s\n%s\n' "$published" "$version" | grep . | sort -V)
              if [ "$version" = "$(grep "^$major\." <<< "$releases" | tail -1)" ]; then
                paths="$paths $major"
              fi
              if [ "$version" = "$(tail -1 <<< "$releases")" ]; then
                paths="$paths ."
              fi
            fi
          fi
          # Until the first release is published, the root shows main
          if [ -z "$published" ] && [[ "$paths" != *" ." ]]; then
            paths="$paths ."
          fi
          echo "Publishing version $version to: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: |
          mkdir -p ./output
          docker run --name=scp --rm \
            -v ${{ github.workspace }}/input:/app/input \
            -v ${{ github.workspace }}/output:/app/output \
            -v ${{ github.workspace }}/ig.ini:/app/ig.ini \
            -v ${{ github.workspace }}/sushi-config.yaml:/app/sushi-config.yaml \
            localhost:5000/nuts-foundation/publisher:latest
      - name: Update published versions
        env:
          PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          for path in $PATHS; do
            if [ "$path" = "." ]; then
              # Replace the root, but keep the version directories next to it
              rsync -a --checksum --delete --exclude '/.git' --exclude '/current/' --exclude '/[0-9]*/' output/ site/
            else
              mkdir -p "site/$path"
              rsync -a --checksum --delete output/ "site/$path/"
            fi
          done
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Publish ${GITHUB_SHA::7} to: $PATHS" || echo "No changes to publish"
          git push origin gh-pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Tag release
        # The tag records which commit was published as the release
        if: steps.paths.outputs.release
        env:
          TAG: v${{ steps.paths.outputs.release }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::warning::Tag $TAG already exists and has not been changed"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
